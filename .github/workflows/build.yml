name: CI
on: [push, pull_request]

env:
  BUILD_PROFILE: Release
  VCPKG_TRIPLET: x64-windows-static-md
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg_cache,readwrite

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-
      - name: Install vcpkg Packages
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg_cache" | Out-Null
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg install --triplet $env:VCPKG_TRIPLET --x-install-root="vcpkg_installed\$env:VCPKG_TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: msbuild /p:Configuration=${{ env.BUILD_PROFILE }}
      - name: Extract Short Commit Hash
        id: extract
        shell: bash
        run: echo "commit=`git rev-parse --short HEAD`" >> $GITHUB_OUTPUT
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsx-devel-${{ steps.extract.outputs.commit }}
          path: |
            bin/${{ env.BUILD_PROFILE }}/*.dll
            bin/${{ env.BUILD_PROFILE }}/*.exe
            bin/${{ env.BUILD_PROFILE }}/*.pdb
            bin/${{ env.BUILD_PROFILE }}/*.txt
            thirdpartylegalnotices.txt
